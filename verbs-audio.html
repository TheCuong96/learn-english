      .controls { margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
      input[type="search"] { padding: 8px 12px; font-size: 18px; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; min-width: 200px; background: rgba(255,255,255,0.1); color: #ffffff; backdrop-filter: blur(5px); }
      input[type="search"]::placeholder { color: rgba(255,255,255,0.7); }
      select, button { padding: 8px 12px; font-size: 18px; border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; background: rgba(255,255,255,0.1); color: #ffffff; }
      button { background: linear-gradient(45deg, #667eea, #764ba2); color: white; border: none; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
      button:hover { background: linear-gradient(45deg, #5a67d8, #6b46c1); transform: translateY(-1px); }
      ul { 
        list-style: none; 
        padding: 0; 
        margin: 0; 
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
        gap: 64px;
        max-width: 100%;
      }
      li { 
        display: flex; 
        align-items: center;
        gap: 15px; 
        padding: 16px; 
        background: rgba(255,255,255,0.1); 
        border-radius: 12px; 
        box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        border: 1px solid rgba(255,255,255,0.2);
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
      }
      li:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        background: rgba(255,255,255,0.15);
      }
      .speak { 
        display: none;
      }
      .verb-info { display: flex; flex-direction: column; flex: 1; }
      .verb-forms { 
        display: flex; 
        gap: 15px; 
        margin-bottom: 4px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .verb-form { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        padding: 6px 12px; 
        border-radius: 6px; 
        min-width: 80px;
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1px solid rgba(255,255,255,0.2);
      }
      .verb-form:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      }
      .v1 { background: rgba(46, 204, 113, 0.2); border: 1px solid #2ecc71; box-shadow: 0 2px 4px rgba(46, 204, 113, 0.3); }
      .v2 { background: rgba(241, 196, 15, 0.2); border: 1px solid #f1c40f; box-shadow: 0 2px 4px rgba(241, 196, 15, 0.3); }
      .v3 { background: rgba(52, 152, 219, 0.2); border: 1px solid #3498db; box-shadow: 0 2px 4px rgba(52, 152, 219, 0.3); }
      .form-label { font-size: 12px; font-weight: bold; text-transform: uppercase; margin-bottom: 2px; opacity: 0.8; }
      .v1 .form-label { color: rgba(46, 204, 113, 0.7); text-shadow: 0 1px 2px rgba(0,0,0,0.2); font-size: 12px; }
      .v2 .form-label { color: rgba(241, 196, 15, 0.7); text-shadow: 0 1px 2px rgba(0,0,0,0.2); font-size: 12px; }
      .v3 .form-label { color: rgba(52, 152, 219, 0.7); text-shadow: 0 1px 2px rgba(0,0,0,0.2); font-size: 12px; }
      .form-value { 
        font-weight: 700; 
        font-size: 20px; 
        margin-bottom: 4px; 
        color: yellow; 
        text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        letter-spacing: 0.5px;
      }
      .form-meaning { 
        font-size: 12px; 
        color: rgba(255,255,255,0.5); 
        font-style: italic; 
        text-align: center;
        word-wrap: break-word;
        max-width: 120px;
        text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        font-weight: 300;
      }
      /* Loại bỏ viền đậm; chỉ dùng màu nền để phân biệt */
      .meaning { color: #7f8c8d; font-style: italic; margin-top: 4px; display: none; }
      .small { color: rgba(255,255,255,0.8); font-size: 16px; }
      .counts { margin-left: auto; font-weight: 500; opacity: 0.9; }
      .verb-extra {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .verb-color {
        width: 160px;
        height: 110px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.2);
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: rgba(255,255,255,0.95);
        text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        letter-spacing: 0.5px;
      }
      .example {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: 520px;
      }
      .example-en { color: #ffffff; font-size: 16px; font-weight: 500; }
      .example-vi { color: rgba(255,255,255,0.8); font-size: 14px; font-style: italic; }
    </style>

  <body>
    <h1>Nghe phát âm động từ</h1>
    <div class="controls">
      <input id="search" type="search" placeholder="Tìm động từ (ví dụ: prefer)" />
      <select id="voice"></select>
      <label class="small">Tốc độ: <input id="rate" type="range" min="0.6" max="1.4" step="0.1" value="1" /></label>
      <label class="small">Cường độ: <input id="volume" type="range" min="0.2" max="1" step="0.1" value="1" /></label>
      <button id="test">Phát thử "example"</button>
      <label class="small">Ảnh: 
        <select id="media">
          <option value="icon" selected>Icon</option>
          <option value="photo">Photo</option>
          <option value="gif">GIF</option>
        </select>
      </label>
      <label class="small">Tenor API: <input id="tenorKey" type="password" placeholder="Dán API key để dùng GIF" style="width: 220px;" /></label>
      <span id="counts" class="small counts"></span>
    </div>

      function dedupeVerbs(items) {
        const seen = new Set();
        const out = [];
        for (const it of items) {
          const key = (it[0] || '').toLowerCase();
          if (!key || seen.has(key)) continue;
          seen.add(key);
          out.push(it);
        }
        return out;
      }

      // Chuẩn hóa chuỗi để tìm kiếm không phân biệt hoa/thường và dấu tiếng Việt
      function normalizeText(str) {
        return (str || '')
          .toString()
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '');
      }

      function isSameForm(a, b) {
        return (a || '').toLowerCase() === (b || '').toLowerCase();
      }

      function computeSameCounts(items) {
        let sameV2V3 = 0;
        let sameAll = 0;
        for (const it of items) {
          const v1 = (it[0] || '').toString();
          const v2 = (it[1] || '').toString();
          const v3 = (it[2] || '').toString();
          if (!v1 || !v2 || !v3) continue;
          const a = v1.toLowerCase();
          const b = v2.toLowerCase();
          const c = v3.toLowerCase();
          if (b === c) sameV2V3++;
          if (a === b && a === c) sameAll++;
        }
        return { sameV2V3, sameAll };
      }

      function render(filter = '') {
        listEl.innerHTML = '';
        const q = normalizeText(filter.trim());
        const source = dedupeVerbs(verbs);
        const filtered = source.filter((verbData) => {
          if (!q) return true;
          let [v1, v2, v3, meaning1, meaning2, meaning3] = verbData;
          // Bổ sung nghĩa tiếng Việt nếu thiếu để có thể tìm theo nghĩa
          const vi = viDict[v1 && v1.toLowerCase()];
          if (vi) {
            meaning1 = meaning1 || vi.base;
            meaning2 = meaning2 || vi.past;
            meaning3 = meaning3 || vi.pp;
          }
          const fields = [v1, v2, v3, meaning1, meaning2, meaning3]
            .filter(Boolean)
            .map(normalizeText);
          return fields.some(f => f.includes(q));
        });
        if (countsEl) {
          const counts = computeSameCounts(source);
          countsEl.textContent = `Kết quả: ${filtered.length} / Tổng: ${source.length} | V2=V3: ${counts.sameV2V3} | V1=V2=V3: ${counts.sameAll}`;
        }
        filtered.forEach((verbData) => {
          let [v1, v2, v3, meaning1, meaning2, meaning3, imageQuery, exampleEnRaw, exampleViRaw] = verbData;
          // Bổ sung/ghi đè phần thiếu từ từ điển tiếng Việt nếu có
          {
            const vi = viDict[v1 && v1.toLowerCase()];
            if (vi) {
              if (!meaning1) meaning1 = vi.base;
              if (!meaning2) meaning2 = vi.past;
              if (!meaning3) meaning3 = vi.pp;
            }
          }
          const li = document.createElement('li');
          
          // Verb info container
          const verbInfo = document.createElement('div');
          verbInfo.className = 'verb-info';
          
          // Verb forms container
          const verbForms = document.createElement('div');
          verbForms.className = 'verb-forms';
          
          // V1 (Present)
          const v1Form = document.createElement('div');
          v1Form.className = 'verb-form v1';
          const v1Meaning = meaning1 || '';
          v1Form.innerHTML = `
            <div class="form-label">V1 (Hiện tại)</div>
            <div class="form-value">${v1}</div>
            <div class="form-meaning">${v1Meaning}</div>
          `;
          v1Form.addEventListener('click', () => speak(v1));
          
          // V2 (Past)
          const v2Form = document.createElement('div');
          v2Form.className = 'verb-form v2';
          const v2Meaning = meaning2 || (meaning1 ? `đã ${meaning1}` : '');
          v2Form.innerHTML = `
            <div class="form-label">V2 (Quá khứ)</div>
            <div class="form-value">${v2}</div>
            <div class="form-meaning">${v2Meaning}</div>
          `;
          v2Form.addEventListener('click', () => speak(v2));
          
          // V3 (Past Participle)
          const v3Form = document.createElement('div');
          v3Form.className = 'verb-form v3';
          const v3Meaning = meaning3 || (meaning1 ? `được ${meaning1}` : '');
          v3Form.innerHTML = `
            <div class="form-label">V3 (Phân từ)</div>
            <div class="form-value">${v3}</div>
            <div class="form-meaning">${v3Meaning}</div>
          `;
          v3Form.addEventListener('click', () => speak(v3));

          // Đồng bộ màu theo quy tắc người dùng
          const sameV2V3 = isSameForm(v2, v3);
          const sameAll = isSameForm(v1, v2) && isSameForm(v1, v3);
          if (sameAll) {
            v2Form.className = 'verb-form v1';
            v3Form.className = 'verb-form v1';
          } else if (sameV2V3) {
            v3Form.className = 'verb-form v2';
          }

          // Không áp dụng màu ngẫu nhiên nữa; dùng lớp màu cố định theo v1/v2/v3
          v1Form.style.background = '';
          v2Form.style.background = '';
          v3Form.style.background = '';
          
          verbForms.appendChild(v1Form);
          verbForms.appendChild(v2Form);
          verbForms.appendChild(v3Form);
          
          verbInfo.appendChild(verbForms);

          // Extra: image + example
          const extra = document.createElement('div');
          extra.className = 'verb-extra';

          const exampleBox = document.createElement('div');
          exampleBox.className = 'example';

          const example = generateExample(v1, meaning1);
          const exampleEn = exampleEnRaw || example.en;
          const exampleVi = exampleViRaw || example.vi;

          const exEnEl = document.createElement('div');
          exEnEl.className = 'example-en';
          exEnEl.textContent = exampleEn;
          exEnEl.addEventListener('click', () => speak(exampleEn));

          const exViEl = document.createElement('div');
          exViEl.className = 'example-vi';
          exViEl.textContent = exampleVi;

          exampleBox.appendChild(exEnEl);
          exampleBox.appendChild(exViEl);

          const colorBox = document.createElement('div');
          colorBox.className = 'verb-color';
          colorBox.style.background = colorFromString(v1 || 'verb');
          colorBox.textContent = v1.toUpperCase();

          extra.appendChild(colorBox);
          extra.appendChild(exampleBox);

          verbInfo.appendChild(extra);
          
          li.appendChild(verbInfo);
          listEl.appendChild(li);
        });
      }

      function populateVoices() {
        const voices = speechSynthesis.getVoices();
        voiceEl.innerHTML = '';
        voices
          .filter(v => /en-|English/i.test(v.lang))
          .forEach((v, i) => {
            const opt = document.createElement('option');
            opt.value = v.name;
            opt.textContent = `${v.name} (${v.lang})`;
            if (i === 0) opt.selected = true;
            voiceEl.appendChild(opt);
          });
      }

      function speak(text) {
        const utter = new SpeechSynthesisUtterance(text);
        const chosen = speechSynthesis.getVoices().find(v => v.name === voiceEl.value);
        if (chosen) utter.voice = chosen;
        utter.lang = (chosen && chosen.lang) || 'en-US';
        utter.rate = parseFloat(rateEl.value);
        utter.volume = parseFloat(volumeEl.value);
        speechSynthesis.cancel();
        speechSynthesis.speak(utter);
      }

      rateEl.addEventListener('input', () => {});
      volumeEl.addEventListener('input', () => {});

      populateVoices();
      window.speechSynthesis.onvoiceschanged = populateVoices;
